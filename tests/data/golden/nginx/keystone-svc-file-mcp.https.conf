# Rendered by keystonectl. Do not edit the copy under sites-available.
# Substitutions: domain, upstream, host port, locations, healthz path, certificate, key.
# Port 80 redirects to 443 after the certificate is installed. certbot renewal matches server_name.

upstream keystone_svc_file_mcp {
    server 127.0.0.1:47600;
}

server {
    listen 80;
    listen [::]:80;
    server_name files.example.com;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name files.example.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/files.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/files.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;

    location ^~ /u/ {
        proxy_pass http://keystone_svc_file_mcp;
        proxy_http_version 1.1;
        proxy_set_header Host              127.0.0.1;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        client_max_body_size 100m;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        access_log off;          # the token in the path is a secret
    }
    location ^~ /d/ {
        proxy_pass http://keystone_svc_file_mcp;
        proxy_http_version 1.1;
        proxy_set_header Host              127.0.0.1;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        client_max_body_size 100m;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        access_log off;          # the token in the path is a secret
    }

    location = /healthz {
        proxy_pass http://keystone_svc_file_mcp/healthz;
        proxy_set_header Host 127.0.0.1;
        access_log off;
    }

    location / {
        return 404;
    }
}
