schema_version: 1
kind: service
name: hello-worker
version: "1.0.0"
publisher: keystone-codes
summary: Background worker that reads objects from S3.
compat:
  keystone_mcp: ">=0.5.0,<2"
  contracts:
    - upstream-registry/1
needs:
  - kind: s3
    version: 1
    bind_env:
      endpoint: HELLO_S3_ENDPOINT
      region: HELLO_S3_REGION
      bucket: HELLO_S3_BUCKET
      access_key: HELLO_S3_ACCESS_KEY
      secret_key: HELLO_S3_SECRET_KEY
      path_style: HELLO_S3_PATH_STYLE
containers:
  worker:
    image: "ghcr.io/example/hello-worker:1.0.0@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    command:
      - hello-worker
    healthcheck:
      command:
        - hello-worker
        - health
