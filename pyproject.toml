[project]
name = "keystonectl"
version = "0.1.0"
description = "Install and manage services behind a keystone-mcp deployment."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6",
    "jsonschema>=4.18",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/keystonectl"]

[tool.hatch.build.targets.wheel.force-include]
"src/keystonectl/schemas/lock-v1.json" = "keystonectl/schemas/lock-v1.json"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs Docker",
]
