[project]
name = "keystonectl"
version = "0.2.1"
description = "Install and check services behind a Keystone MCP gateway: package lint, deployment check, plan/apply"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Keystone Codes" }]
keywords = ["mcp", "keystone", "installer", "docker-compose", "gateway"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Installation/Setup",
    "Typing :: Typed",
]
dependencies = [
    "pyyaml>=6",
    "jsonschema>=4.18",
    "boto3>=1.34",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "packaging>=24",
]

[project.scripts]
keystonectl = "keystonectl.cli:main"

[project.urls]
Homepage = "https://github.com/keystone-codes/keystonectl"
Repository = "https://github.com/keystone-codes/keystonectl"
Issues = "https://github.com/keystone-codes/keystonectl/issues"
Changelog = "https://github.com/keystone-codes/keystonectl/blob/main/CHANGELOG.md"
Documentation = "https://github.com/keystone-codes/keystonectl/tree/main/docs"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff",
    "pyyaml>=6",
]


[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/keystonectl"]

[tool.hatch.build.targets.wheel.force-include]
"src/keystonectl/nginx/service.conf.template" = "keystonectl/nginx/service.conf.template"
"src/keystonectl/nginx/service-https.conf.template" = "keystonectl/nginx/service-https.conf.template"

[tool.hatch.build.targets.sdist]
only-include = ["src/keystonectl", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Byte-pinned copy of stdio-box tests/support/atlassian_mock.py. Do not reformat.
extend-exclude = ["scripts/e2e/fixtures/atlassian-mock"]

[tool.ruff.lint.per-file-ignores]
"src/keystonectl/resources/*_probe.py" = ["BLE001", "S110"]
"tests/support/fake_pg.py" = ["PYI034", "PYI036"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-m \"not integration\""
markers = [
    "integration: needs Docker",
]
