[project]
name = "keystonectl"
version = "0.1.0"
description = "Keystone service catalog installer and generator"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "boto3>=1.34",
    "httpx>=0.27",
    "pyyaml>=6",
    "jsonschema>=4.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/keystonectl"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
markers = [
    "integration: needs Docker",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff",
]
