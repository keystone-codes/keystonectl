[project]
name = "keystonectl"
version = "0.1.0"
description = "Validate service packages that sit behind keystone-mcp"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "pyyaml>=6",
    "jsonschema>=4.18",
    "boto3>=1.34",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/keystonectl"]

[tool.hatch.build.targets.wheel.force-include]
"src/keystonectl/schemas/service-package-v1.json" = "keystonectl/schemas/service-package-v1.json"
"src/keystonectl/schemas/lock-v1.json" = "keystonectl/schemas/lock-v1.json"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"src/keystonectl/resources/*_probe.py" = ["BLE001", "S110"]
"tests/support/fake_pg.py" = ["PYI034", "PYI036"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: needs Docker",
]
