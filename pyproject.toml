[project]
name = "keystonectl"
version = "0.1.0"
description = "Keystone service catalog installer and generator"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "psycopg[binary]>=3.2",
    "pyyaml>=6",
    "jsonschema>=4.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/keystonectl"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
"src/keystonectl/resources/*_probe.py" = ["BLE001", "S110"]
"tests/support/fake_pg.py" = ["PYI034", "PYI036"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "integration: needs Docker",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff",
]
