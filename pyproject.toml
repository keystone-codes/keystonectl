[project]
name = "keystonectl"
version = "0.1.0"
description = "Install and check services behind a Keystone MCP gateway"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "pyyaml>=6",
    "jsonschema>=4.18",
    "packaging>=24",
]

[project.scripts]
keystonectl = "keystonectl.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/keystonectl"]

[tool.hatch.build.targets.wheel.force-include]
"src/keystonectl/schemas" = "keystonectl/schemas"
"src/keystonectl/nginx/.gitkeep" = "keystonectl/nginx/.gitkeep"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
markers = [
    "integration: needs Docker",
]
testpaths = ["tests"]
pythonpath = ["."]
