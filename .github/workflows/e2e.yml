name: e2e

on:
  pull_request:
    paths:
      - "src/**"
      - "schemas/**"
      - "nginx/**"
      - "scripts/e2e*/**"
      - "scripts/e2e.sh"
      - "tests/e2e/**"
      - "tests/test_e2e_*.py"
      - "skills/**"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:
    inputs:
      keystone_deploy_ref:
        description: keystone-deploy commit (release/catalog)
        required: false
        default: 5b6c8f5db02a09248c1f12e48e03500c1becb8a1
      keystone_mcp_ref:
        description: keystone-mcp commit (tag v0.6.2)
        required: false
        default: 5d7084ddc2fd65fc5377e66710781d9e9cd613b3
      partner_catalog_url:
        description: partner catalog URL (empty keeps the local file:// catalog)
        required: false
        default: ""

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        layout: [production-example, keystone-deploy]
    env:
      E2E_KEYSTONE_DEPLOY_REF: ${{ inputs.keystone_deploy_ref || '5b6c8f5db02a09248c1f12e48e03500c1becb8a1' }}
      E2E_KEYSTONE_MCP_REF: ${{ inputs.keystone_mcp_ref || '5d7084ddc2fd65fc5377e66710781d9e9cd613b3' }}
      E2E_PARTNER_CATALOG_URL: ${{ inputs.partner_catalog_url }}
      KEYSTONE_DEPLOY_TOKEN: ${{ secrets.KEYSTONE_DEPLOY_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Check the script
        run: bash -n scripts/e2e.sh && shellcheck scripts/e2e.sh
      - name: Log in to GHCR
        env:
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          if [[ -n "${GHCR_READ_TOKEN}" ]]; then
            printf '%s' "${GHCR_READ_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          fi
      - name: Run both storage and postgres modes
        run: >-
          scripts/e2e.sh
          --layout ${{ matrix.layout }}
          --profile ci
          --storage both
          --postgres both
          --tls custom
          --report e2e-${{ matrix.layout }}.jsonl
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-${{ matrix.layout }}
          if-no-files-found: ignore
          path: |
            e2e-${{ matrix.layout }}.jsonl
            e2e-diagnostics/
