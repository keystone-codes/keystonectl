name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and check only; publish nothing"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  version-gate:
    name: Version gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Check version consistency with tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            uv run --no-project --python 3.12 python scripts/check_version.py --tag "${GITHUB_REF_NAME}"
          else
            uv run --no-project --python 3.12 python scripts/check_version.py
          fi

  test:
    needs: version-gate
    uses: ./.github/workflows/ci.yml

  build-dist:
    name: Build and check the PyPI distribution
    needs: version-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Build wheel and sdist
        run: uv build
      - name: Check the built wheel and sdist
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            uv run --no-project --python 3.12 python scripts/check_version.py --tag "${GITHUB_REF_NAME}" --dist-dir dist
          else
            uv run --no-project --python 3.12 python scripts/check_version.py --dist-dir dist
          fi
      - name: Refuse a version that is already on PyPI
        if: github.event_name == 'push'
        run: |
          v="${GITHUB_REF_NAME#v}"
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/keystonectl/$v/json")
          if [ "$code" = "200" ]; then echo "keystonectl $v is already on PyPI"; exit 1; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist/

  wheel-smoke:
    name: Wheel smoke test
    needs: build-dist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the built wheel into a clean virtualenv
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
      - name: Smoke test the installed wheel
        run: bash scripts/smoke_wheel.sh /tmp/venv/bin/keystonectl

  pypi:
    name: Publish to PyPI
    needs: [test, wheel-smoke]
    if: github.event_name == 'push' && vars.SKIP_PYPI_PUBLISH != 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  pypi-verify:
    name: Verify PyPI install
    needs: pypi
    runs-on: ubuntu-latest
    steps:
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Wait for PyPI index
        run: |
          v="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 10); do
            out=$(uvx --refresh --from "keystonectl==$v" keystonectl --version 2>/dev/null || true)
            [ "$out" = "keystonectl $v" ] && exit 0
            sleep 30
          done
          echo "keystonectl $v is not installable from PyPI after 5 minutes"
          exit 1

  github-release:
    name: Create GitHub Release
    needs: [pypi, pypi-verify]
    if: github.event_name == 'push' && needs.pypi.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Extract release notes from CHANGELOG
        run: |
          python3 scripts/extract_changelog.py "${GITHUB_REF_NAME#v}" > release-notes.md
          echo "" >> release-notes.md
          echo "PyPI: https://pypi.org/project/keystonectl/${GITHUB_REF_NAME#v}/" >> release-notes.md
          echo "Install: uv tool install keystonectl==${GITHUB_REF_NAME#v}" >> release-notes.md
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "keystonectl ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md \
            --verify-tag
